### A real place from the Korea Tourism Organization TourAPI (or Kakao as a
### fallback). Places are never generated by AI; only the summaries are.
class: Place
table: place
fields:
  ### "tour:<contentid>" or "kakao:<id>" (unique).
  sourceId: String
  name: String
  ### English name (romanized by the summarizer when no official name exists).
  nameEn: String?
  ### sight | food | activity
  category: String
  address: String
  lat: double
  lng: double
  tel: String?
  imageUrl: String?
  ### Official description from TourAPI.
  overview: String?
  ### Practical info from TourAPI, e.g. {"hours": "...", "closed": "..."}.
  facts: Map<String, String>?
  ### AI summary of the official info: good = highlights, bad = good to know.
  highlightKo: ReviewSummary?
  highlightEn: ReviewSummary?
  ### AI summary of in-app user reviews (when there are enough of them).
  reviewSummaryKo: ReviewSummary?
  reviewSummaryEn: ReviewSummary?
  ### Review count at the time reviewSummary was generated.
  reviewSummaryBasis: int, default=0
  reviewCount: int, default=0
  ratingAvg: double?
  ### healing | activity | food | photo
  tags: List<String>?
  detailFetchedAt: DateTime?
  summarizedAt: DateTime?
  ### Distance from the demo city center in meters (computed per request).
  distance: int?, !persist
indexes:
  place_source_id_idx:
    fields: sourceId
    unique: true
